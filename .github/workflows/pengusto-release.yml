name: Pengusto APK release
on:
  push:
    tags: ['pengusto-v*']
permissions:
  contents: write
concurrency:
  group: pengusto-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'pengusto/Calendar'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build, check and sign
        env:
          KEYSTORE_BASE64: ${{ secrets.PENGUSTO_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          umask 077
          export SIGNING_STORE_FILE="$RUNNER_TEMP/pengusto-release.jks"
          trap 'rm -f "$SIGNING_STORE_FILE"' EXIT
          test -n "$KEYSTORE_BASE64"
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
          ./gradlew :app:assembleFossRelease :app:testFossDebugUnitTest :app:lintFossRelease :app:detekt --no-daemon --console=plain -Dorg.gradle.jvmargs=-Xmx4g -PDISTRIBUTION_APP_ID=io.github.pengusto.calendar -PVERSION_NAME="${RELEASE_TAG#pengusto-v}" -PVERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"
          mkdir -p release-assets
          cp app/build/outputs/apk/foss/release/*.apk release-assets/Pengusto-Calendar.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release-assets/Pengusto-Calendar.apk
          cd release-assets
          sha256sum Pengusto-Calendar.apk > SHA256SUMS.txt
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/Pengusto-Calendar.apk release-assets/SHA256SUMS.txt --verify-tag --title "Pengusto Calendar ${RELEASE_TAG#pengusto-v}" --notes-file docs/RELEASE-NOTES.md
